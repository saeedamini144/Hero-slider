<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اسلایدر طراحی داخلی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --olive:#7a7150;
    --olive-dark:#645c40;
    --ink:#151515;
    --muted:#6f6a64;
    --paper:#ede7e0;
    --white:#ffffff;
    --pad-x:clamp(20px,6.5vw,130px);
    --ease:cubic-bezier(.22,.61,.36,1);
    --duration:6000ms; /* زمان هر اسلاید */
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:"Vazirmatn",Tahoma,sans-serif;background:var(--paper);color:var(--ink)}
  button{font:inherit;cursor:pointer}

  /* ========== Hero ========== */
  .hero{
    position:relative;
    height:min(100svh,820px);
    min-height:560px;
    overflow:hidden;
    background:var(--paper);
    isolation:isolate;
  }

  /* پس‌زمینه‌ها */
  .hero__slides{position:absolute;inset:0;z-index:-1}
  .hero__bg{
    position:absolute;inset:0;
    background-color:var(--paper);
    background-image:var(--img);
    background-size:cover;
    background-position:center;
    opacity:0;
    transform:scale(1.08);
    transition:opacity 1.1s var(--ease), transform 7s linear;
  }
  .hero__bg.is-active{opacity:1;transform:scale(1)}
  /* لایه روشن سمت متن برای خوانایی */
  .hero__slides::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(to left, rgba(240,235,229,.88) 0%, rgba(240,235,229,.55) 32%, rgba(240,235,229,0) 60%);
  }

  .hero__inner{
    position:relative;
    height:100%;
    padding:0 var(--pad-x);
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    align-items:center;
    gap:40px;
  }

  /* ========== متن ========== */
  .hero__content{max-width:520px;justify-self:start} /* در RTL = سمت راست */
  .hero__eyebrow{
    margin:0 0 18px;
    font-size:15px;font-weight:500;
    color:var(--olive);
  }
  .hero__title{
    position:relative;
    width:fit-content;
    margin:0 0 26px;
    font-size:clamp(34px,4.4vw,64px);
    font-weight:900;
    line-height:1.25;
    letter-spacing:-.5px;
  }
  .hero__title .diamond{
    position:absolute;
    left:-26px; top:52%;
    width:40px;height:40px;
    border:1.5px solid rgba(255,255,255,.9);
    transform:rotate(45deg);
    pointer-events:none;
  }
  .hero__desc{
    margin:0 0 36px;
    max-width:44ch;
    font-size:clamp(14px,1.05vw,16px);
    line-height:2;
    color:var(--muted);
  }
  .hero__cta{
    display:inline-flex;align-items:stretch;
    text-decoration:none;
    border:1px solid var(--olive);
  }
  .hero__cta-label{
    display:flex;align-items:center;
    padding:0 30px;height:56px;
    background:var(--olive);color:var(--white);
    font-size:15px;font-weight:500;
    transition:background .3s;
  }
  .hero__cta-icon{
    width:50px;display:grid;place-items:center;
    background:var(--white);color:var(--ink);
    transition:background .3s,color .3s;
  }
  .hero__cta-icon svg{transition:transform .3s var(--ease)}
  .hero__cta:hover .hero__cta-label{background:var(--olive-dark)}
  .hero__cta:hover .hero__cta-icon svg{transform:translateX(-4px)}

  /* انیمیشن ورود متن هنگام تعویض اسلاید */
  .hero__content.is-animating > *{animation:rise .8s var(--ease) both}
  .hero__content.is-animating > :nth-child(2){animation-delay:.08s}
  .hero__content.is-animating > :nth-child(3){animation-delay:.16s}
  .hero__content.is-animating > :nth-child(4){animation-delay:.24s}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

  /* ========== بندانگشتی‌ها و دکمه‌ها ========== */
  .hero__side{justify-self:end;display:flex;flex-direction:column;gap:clamp(40px,8vh,96px)} /* در RTL = سمت چپ */
  .hero__thumbs{
    display:flex;gap:20px;
    direction:ltr;          /* ترتیب بصری مانند طرح */
  }
  .thumb{
    position:relative;
    width:clamp(120px,10.5vw,200px);
    aspect-ratio:1;
    padding:0;border:0;
    background:var(--paper) var(--img) center/cover no-repeat;
    box-shadow:0 18px 30px -18px rgba(60,45,30,.45);
    overflow:hidden;
    animation:thumbIn .7s var(--ease) both;
  }
  .thumb:nth-child(2){animation-delay:.07s}
  .thumb:nth-child(3){animation-delay:.14s}
  .thumb::after{
    content:"";position:absolute;inset:0;
    background:rgba(122,113,80,.35);
    opacity:0;transition:opacity .3s;
  }
  .thumb:hover::after{opacity:1}
  @keyframes thumbIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

  .hero__nav{display:flex;gap:16px;direction:ltr}
  .nav-btn{
    width:56px;height:56px;border-radius:50%;
    border:0;background:var(--olive);color:var(--white);
    display:grid;place-items:center;
    transition:background .3s,transform .3s var(--ease);
  }
  .nav-btn:hover{background:var(--olive-dark);transform:scale(1.06)}

  /* نوار پیشرفت پایین */
  .hero__progress{
    position:absolute;left:0;right:0;bottom:0;height:3px;
    background:rgba(21,21,21,.08);
  }
  .hero__progress span{
    display:block;height:100%;width:100%;
    background:var(--ink);
    transform:scaleX(0);transform-origin:left;
  }
  .hero__progress span.run{animation:progress var(--duration) linear forwards}
  .hero.is-paused .hero__progress span.run{animation-play-state:paused}
  @keyframes progress{to{transform:scaleX(1)}}

  /* شماره اسلاید (نقطه‌ها) */
  .hero__dots{
    position:absolute;bottom:28px;right:var(--pad-x);
    display:flex;gap:10px;
  }
  .dot{
    width:28px;height:3px;padding:0;border:0;
    background:rgba(21,21,21,.2);
    transition:background .3s,width .3s var(--ease);
  }
  .dot[aria-current="true"]{background:var(--olive);width:48px}

  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}

  /* ========== تبلت ========== */
  @media (max-width:1024px){
    .hero__inner{gap:24px}
    .hero__thumbs{gap:14px}
    .thumb{width:clamp(100px,13vw,150px)}
    .hero__title .diamond{width:30px;height:30px;left:-18px}
  }

  /* ========== موبایل و تبلت عمودی ========== */
  @media (max-width:820px){
    .hero{height:auto;min-height:100svh}
    .hero__slides::after{
      background:linear-gradient(to top, rgba(240,235,229,.96) 0%, rgba(240,235,229,.85) 45%, rgba(240,235,229,.15) 80%);
    }
    .hero__inner{
      grid-template-columns:1fr;
      align-content:end;
      padding-top:clamp(120px,32vh,280px);
      padding-bottom:84px;
      min-height:100svh;
      gap:32px;
    }
    .hero__content{max-width:none}
    .hero__side{justify-self:stretch;flex-direction:row;align-items:center;justify-content:space-between;gap:20px}
    .thumb{width:clamp(72px,18vw,120px)}
    .hero__dots{right:auto;left:50%;transform:translateX(-50%);bottom:30px}
  }

  @media (max-width:520px){
    .hero__thumbs .thumb:nth-child(3){display:none}
    .nav-btn{width:48px;height:48px}
    .hero__cta{width:100%}
    .hero__cta-label{flex:1;justify-content:center;height:52px}
    .hero__title .diamond{display:none}
    .hero__eyebrow{font-size:14px;margin-bottom:12px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
    .hero__bg{transform:none!important}
  }
</style>
</head>
<body>

<section class="hero" id="hero" aria-roledescription="carousel" aria-label="اسلایدر اصلی">
  <div class="hero__slides" id="heroSlides"></div>

  <div class="hero__inner">
    <!-- متن اسلاید اول در HTML نوشته شده تا برای موتورهای جستجو قابل خواندن باشد -->
    <div class="hero__content" id="heroContent" aria-live="polite">
      <p class="hero__eyebrow" id="heroEyebrow">دکوراسیون داخلی مینیمال</p>
      <h1 class="hero__title"><span id="heroTitle">طراحی با<br>هدف</span><span class="diamond" aria-hidden="true"></span></h1>
      <p class="hero__desc" id="heroDesc">هر قطعه در فضای شما باید دلیلی برای بودن داشته باشد. ما خانه‌هایی می‌سازیم آرام، کاربردی و ماندگار؛ با متریال طبیعی و رنگ‌هایی که چشم را خسته نمی‌کنند.</p>
      <a class="hero__cta" id="heroCta" href="#">
        <span class="hero__cta-label" id="heroCtaLabel">ایده‌های طراحی را ببینید</span>
        <span class="hero__cta-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </span>
      </a>
    </div>

    <div class="hero__side">
      <div class="hero__thumbs" id="heroThumbs"></div>
      <div class="hero__nav">
        <button class="nav-btn" id="nextBtn" aria-label="اسلاید بعدی">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <button class="nav-btn" id="prevBtn" aria-label="اسلاید قبلی">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <div class="hero__dots" id="heroDots"></div>
  <div class="hero__progress"><span id="heroProgress"></span></div>
</section>

<script>
/* ================= تنظیمات اسلایدها =================
   فقط همین آرایه را ویرایش کنید: تصویر، متن‌ها و لینک دکمه */
const SLIDES = [
  {
    image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=1920&q=80&auto=format&fit=crop",
    eyebrow: "دکوراسیون داخلی مینیمال",
    title: "طراحی با<br>هدف",
    desc: "هر قطعه در فضای شما باید دلیلی برای بودن داشته باشد. ما خانه‌هایی می‌سازیم آرام، کاربردی و ماندگار؛ با متریال طبیعی و رنگ‌هایی که چشم را خسته نمی‌کنند.",
    cta: "ایده‌های طراحی را ببینید",
    link: "#"
  },
  {
    image: "https://images.unsplash.com/photo-1618220179428-22790b461013?w=1920&q=80&auto=format&fit=crop",
    eyebrow: "نشیمن و پذیرایی",
    title: "آرامش در<br>جزئیات",
    desc: "چیدمانی که با نور روز هماهنگ است و جای نفس کشیدن دارد. مبلمان کم‌حجم، بافت‌های گرم و فضای خالیِ حساب‌شده.",
    cta: "نمونه‌کارهای نشیمن",
    link: "#"
  },
  {
    image: "https://images.unsplash.com/photo-1552321554-5fefe8c9ef14?w=1920&q=80&auto=format&fit=crop",
    eyebrow: "سرویس و حمام",
    title: "سادگی<br>ماندگار",
    desc: "خطوط تمیز، سطوح یکدست و نگهداری آسان. حمامی که هر روز صبح حس تازگی می‌دهد.",
    cta: "طرح‌های حمام",
    link: "#"
  },
  {
    image: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1920&q=80&auto=format&fit=crop",
    eyebrow: "مشاوره رایگان",
    title: "خانه‌ای که<br>شبیه شماست",
    desc: "از اولین طرح تا اجرای نهایی کنارتان هستیم. سبک زندگی‌تان را بگویید، بقیه‌اش با ما.",
    cta: "درخواست مشاوره",
    link: "#"
  }
];
const AUTOPLAY_MS = 6000;
/* ==================================================== */

(function(){
  const hero      = document.getElementById('hero');
  const slidesEl  = document.getElementById('heroSlides');
  const thumbsEl  = document.getElementById('heroThumbs');
  const dotsEl    = document.getElementById('heroDots');
  const content   = document.getElementById('heroContent');
  const progress  = document.getElementById('heroProgress');
  const $ = id => document.getElementById(id);

  hero.style.setProperty('--duration', AUTOPLAY_MS + 'ms');

  let current = 0, timer = null, paused = false, remaining = AUTOPLAY_MS, startedAt = 0;

  // ساخت پس‌زمینه‌ها و نقطه‌ها
  SLIDES.forEach((s, i) => {
    const bg = document.createElement('div');
    bg.className = 'hero__bg' + (i === 0 ? ' is-active' : '');
    bg.style.setProperty('--img', `url("${s.image}")`);
    slidesEl.appendChild(bg);

    const dot = document.createElement('button');
    dot.className = 'dot';
    dot.setAttribute('aria-label', `اسلاید ${i + 1}`);
    dot.addEventListener('click', () => go(i));
    dotsEl.appendChild(dot);
  });

  function renderThumbs(){
    thumbsEl.innerHTML = '';
    for (let k = 1; k <= Math.min(3, SLIDES.length - 1); k++){
      const idx = (current + k) % SLIDES.length;
      const s = SLIDES[idx];
      const b = document.createElement('button');
      b.className = 'thumb';
      b.style.setProperty('--img', `url("${s.image.replace('w=1920', 'w=420')}")`);
      b.setAttribute('aria-label', `رفتن به: ${s.title.replace(/<br>/g, ' ')}`);
      b.addEventListener('click', () => go(idx));
      thumbsEl.appendChild(b);
    }
  }

  function renderContent(){
    const s = SLIDES[current];
    $('heroEyebrow').textContent  = s.eyebrow;
    $('heroTitle').innerHTML      = s.title;
    $('heroDesc').textContent     = s.desc;
    $('heroCtaLabel').textContent = s.cta;
    $('heroCta').href             = s.link;
    content.classList.remove('is-animating');
    void content.offsetWidth; // ری‌استارت انیمیشن
    content.classList.add('is-animating');
  }

  function renderDots(){
    [...dotsEl.children].forEach((d, i) => d.setAttribute('aria-current', i === current));
  }

  function restartProgress(){
    progress.classList.remove('run');
    void progress.offsetWidth;
    progress.classList.add('run');
  }

  function schedule(ms){
    clearTimeout(timer);
    startedAt = Date.now();
    remaining = ms;
    timer = setTimeout(() => go(current + 1), ms);
  }

  function go(i){
    const next = (i + SLIDES.length) % SLIDES.length;
    if (next !== current){
      slidesEl.children[current].classList.remove('is-active');
      current = next;
      slidesEl.children[current].classList.add('is-active');
      renderContent();
      renderThumbs();
      renderDots();
    }
    restartProgress();
    if (!paused) schedule(AUTOPLAY_MS);
    else remaining = AUTOPLAY_MS;
  }

  function pause(){
    if (paused) return;
    paused = true;
    hero.classList.add('is-paused');
    clearTimeout(timer);
    remaining -= Date.now() - startedAt;
  }
  function resume(){
    if (!paused) return;
    paused = false;
    hero.classList.remove('is-paused');
    schedule(Math.max(remaining, 300));
  }

  // دکمه‌ها (در RTL: فلش چپ = بعدی)
  $('nextBtn').addEventListener('click', () => go(current + 1));
  $('prevBtn').addEventListener('click', () => go(current - 1));

  // توقف هنگام هاور / فوکوس / تب غیرفعال
  hero.addEventListener('mouseenter', pause);
  hero.addEventListener('mouseleave', resume);
  hero.addEventListener('focusin', pause);
  hero.addEventListener('focusout', resume);
  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());

  // کیبورد
  hero.tabIndex = -1;
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(current + 1);
    if (e.key === 'ArrowRight') go(current - 1);
  });

  // سوایپ لمسی (RTL: کشیدن به راست = بعدی)
  let x0 = null, y0 = null;
  hero.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  hero.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) go(dx > 0 ? current + 1 : current - 1);
    x0 = y0 = null;
  });

  // پیش‌بارگذاری تصاویر
  SLIDES.forEach(s => { const im = new Image(); im.src = s.image; });

  renderThumbs();
  renderDots();
  restartProgress();
  schedule(AUTOPLAY_MS);
})();
</script>
</body>
</html>
